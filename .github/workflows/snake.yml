name: Gerar cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12h
  workflow_dispatch:          # botão manual na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2F8BFF&color_dots=#161b22,#0b2a55,#11458f,#1e6fff,#5fd4ff
            dist/snake-light.svg?color_snake=#1E6FFF&color_dots=#ebedf0,#b9d6ff,#7fb2ff,#3d86ff,#1e5bd8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
